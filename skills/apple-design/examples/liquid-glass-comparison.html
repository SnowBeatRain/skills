<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid Glass · 材质对比</title>
  <link rel="stylesheet" href="../assets/liquid-glass.css">
  <style>
    * { box-sizing: border-box; }
    .comparison-intro { margin-bottom: var(--lg-space-8); }
    .comparison-intro h1 { font-size: 2rem; }
    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--lg-space-6); }
    .comparison > article { max-width: none; }
    .solid-card { padding: var(--lg-space-6); border-radius: var(--lg-radius-lg); background: var(--lg-demo-solid); border: 1px solid var(--lg-fallback-border); }
    .comparison-notes { margin-top: var(--lg-space-8); padding-top: var(--lg-space-6); border-top: 1px solid var(--lg-fallback-border); }
    .comparison-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-block: var(--lg-space-5); }
    .comparison-table th, .comparison-table td { padding: var(--lg-space-3) var(--lg-space-2); text-align: left; border-bottom: 1px solid var(--lg-fallback-border); }
    @media (max-width: 640px) { .comparison { grid-template-columns: 1fr; } }
    @media (forced-colors: active) { .solid-card { background: Canvas; color: CanvasText; border-color: CanvasText; } }
  </style>
</head>
<body class="lg-demo">
  <main class="lg-demo-main">
    <header class="comparison-intro">
      <h1>选择合适的材质。</h1>
      <p>相同的灰阶背景，两种清晰的表达。实底与玻璃各有适合的场景。</p>
    </header>
    <div class="comparison">
      <article class="solid-card">
        <h2>实底内容</h2>
        <p>稳定的背景，适合长文、表格和需要专注阅读的信息。</p>
        <p>无需模糊，减少透明度时也保持一致体验。</p>
      </article>
      <article class="lg-surface lg-surface--medium lg-radius--lg lg-card">
        <div class="lg-surface__content">
          <h2>玻璃浮层</h2>
          <p>透出背景的明暗层次，适合浮动导航、工具栏和临时面板。</p>
          <p>轻微高光提示边缘，文字始终保持清楚。</p>
        </div>
      </article>
    </div>
    <section class="comparison-notes">
      <h2>三档 Web 配方</h2>
      <table class="comparison-table">
        <thead><tr><th scope="col">档位</th><th scope="col">模糊</th><th scope="col">饱和度</th></tr></thead>
        <tbody>
          <tr><th scope="row">Subtle</th><td data-token="subtle-blur">12px</td><td data-token="subtle-saturate">140%</td></tr>
          <tr><th scope="row">Medium</th><td data-token="medium-blur">24px</td><td data-token="medium-saturate">180%</td></tr>
          <tr><th scope="row">Strong</th><td data-token="strong-blur">36px</td><td data-token="strong-saturate">220%</td></tr>
        </tbody>
      </table>
      <p>这些数值是本示例的近似配方。Web 无法复刻 Apple 官方折射；窄屏、触摸和系统辅助功能设置会进一步降低效果。</p>
      <a href="liquid-glass-demo.html">体验强度切换</a>
    </section>
  </main>
  <script src="../assets/liquid-glass.js" data-lg-auto="true" defer></script>
  <script>
    const tokens = getComputedStyle(document.documentElement);
    document.querySelectorAll('[data-token]').forEach((cell) => {
      cell.textContent = tokens.getPropertyValue(`--lg-${cell.dataset.token}`).trim();
    });
  </script>
</body>
</html>
